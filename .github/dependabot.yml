version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gems-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
