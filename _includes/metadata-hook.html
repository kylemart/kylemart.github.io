<!-- Match iOS Safari status-bar (theme-color) to the sidebar bg in both modes. -->
<script>
  (function () {
    var SIDEBAR_BG = { light: '#f6f8fa', dark: '#1e1e1e' };
    function getMode() {
      var dm = document.documentElement.getAttribute('data-mode');
      if (dm === 'light' || dm === 'dark') return dm;
      var stored = null;
      try { stored = localStorage.getItem('mode'); } catch (e) {}
      if (stored === 'light' || stored === 'dark') return stored;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyMeta() {
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.remove(); });
      var meta = document.createElement('meta');
      meta.setAttribute('name', 'theme-color');
      meta.setAttribute('content', SIDEBAR_BG[getMode()]);
      document.head.appendChild(meta);
    }
    applyMeta();
    new MutationObserver(applyMeta).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-mode']
    });
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyMeta);
    else if (mq.addListener) mq.addListener(applyMeta);
  })();
</script>
